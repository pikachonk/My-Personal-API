# Keep the existing deployment's volume namespace across the product rename.
name: daybook-cloud
services:
  daybook:
    build: .
    restart: unless-stopped
    command: ["python", "server.py", "--host", "0.0.0.0", "--public-url", "https://${DAYBOOK_DOMAIN:?Set DAYBOOK_DOMAIN in .env}"]
    environment:
      DAYBOOK_ADMIN_PASSWORD: ${DAYBOOK_ADMIN_PASSWORD:?Set a dashboard password in .env}
    volumes:
      - daybook_data:/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - backend
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DAYBOOK_DOMAIN: ${DAYBOOK_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - backend
    depends_on:
      - daybook
networks:
  backend:
volumes:
  daybook_data:
  caddy_data:
  caddy_config:
