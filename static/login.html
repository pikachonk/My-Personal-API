<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1228">
  <title>Sign in &middot; SimonSealsAPI</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/magic.css">
  <script src="/login.js" defer></script>
</head>
<body class="login-page">
  <div class="ambient-sky" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <main class="login-shell">
    <div class="login-intro">
      <a class="brand" href="/" aria-label="SimonSealsAPI home"><span class="brand-mark">S.</span>SimonSealsAPI</a>
      <p class="eyebrow">YOUR PERSONAL CONSTELLATION</p>
      <h1>Welcome back to your world.</h1>
      <p>Your days, your rhythms, and the moments that matter are waiting.</p>
      <div class="login-orbit" aria-hidden="true"><span class="orbit-ring orbit-ring-one"></span><span class="orbit-ring orbit-ring-two"></span><span class="orbit-core">✦</span><span class="orbit-star orbit-star-one">✦</span><span class="orbit-star orbit-star-two">✧</span></div>
    </div>
    <article class="login-card">
      <p class="eyebrow">PRIVATE DASHBOARD</p>
      <h2>Step inside</h2>
      <p class="muted">Sign in to see your activities and connected devices.</p>
      <form id="login-form">
        <label>Dashboard password<input id="password" type="password" autocomplete="current-password" required autofocus></label>
        <p id="login-error" class="error" role="alert"></p>
        <button class="primary" type="submit">Open my space <span aria-hidden="true">↗</span></button>
      </form>
    </article>
  </main>
</body>
</html>
